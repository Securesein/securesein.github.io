name: AI news pipeline

# Targets four daily windows in Europe/Amsterdam time (see SLOTS in
# scripts/check_schedule_gate.py: currently ~08:00, 12:00, 16:00,
# 20:00 — all daytime, nothing runs overnight).
#
# GitHub Actions' `schedule` trigger is not reliable enough to hand-pick
# exact UTC times for this: runs can be delayed by a long margin or
# dropped entirely, especially at the top of the hour under GitHub load
# — a single dropped fire used to mean a fully missed run. So instead
# this fires every hour, all day (cheap — most hours are an instant
# no-op), and check_schedule_gate.py decides which firings actually
# count, based on generous ~2-hour windows: if the exact top-of-hour
# fire for a window is dropped, the next hourly fire still lands inside
# the same window and catches it. That script also owns Amsterdam-time
# handling, so DST needs no manual adjustment here either.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine whether to run now
        id: gate
        run: |
          python scripts/check_schedule_gate.py | tee /tmp/gate.log
          grep '^run=' /tmp/gate.log >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Process Telegram replies since last run
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/process_callbacks.py

      - name: Write blog posts for marked items
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_blog_post.py

      - name: Fetch RSS, summarize, notify Telegram
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/fetch_and_notify.py

      - name: Commit and push state changes
        if: steps.gate.outputs.run == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ src/content/blog/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update pipeline state"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        # Pushes made with the default GITHUB_TOKEN don't trigger other
        # workflows (GitHub's anti-recursion guard on `push`), so
        # deploy.yml wouldn't otherwise pick up this commit — kick it
        # off explicitly instead of adding a separate PAT just for this.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
