name: AI news pipeline

# Manual trigger only for now, while each step is still being tested.
# The `schedule:` cron gets added once the full pipeline (RSS -> Telegram
# -> button -> blogpost) has been verified end-to-end.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Process Telegram button presses since last run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/process_callbacks.py

      - name: Write blog posts for marked items
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_blog_post.py

      - name: Fetch RSS, summarize, notify Telegram
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/fetch_and_notify.py

      - name: Commit and push state changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ src/content/blog/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update pipeline state"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        # Pushes made with the default GITHUB_TOKEN don't trigger other
        # workflows (GitHub's anti-recursion guard on `push`), so
        # deploy.yml wouldn't otherwise pick up this commit — kick it
        # off explicitly instead of adding a separate PAT just for this.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
