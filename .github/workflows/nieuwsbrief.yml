name: AI news pipeline

# Runs twice a day, targeting 08:00 and 20:00 Europe/Amsterdam time.
# GitHub Actions cron is UTC-only and Amsterdam alternates between
# UTC+1 (CET, winter) and UTC+2 (CEST, summer) — a single fixed UTC
# cron would drift an hour off target after each clock change. Instead
# this fires at all four candidate UTC times (covering both offsets)
# and the "Determine whether to run now" step below only lets the rest
# of the job proceed on the two that actually land on 08:00/20:00
# Amsterdam time — the other two are a clean no-op (green, does
# nothing), so no manual DST adjustment is ever needed.
on:
  schedule:
    - cron: "0 6,7,18,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine whether to run now
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered — always runs."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ=Europe/Amsterdam date +%H)
            if [ "$hour" = "08" ] || [ "$hour" = "20" ]; then
              echo "It's $hour:xx in Amsterdam — this is a real run."
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "It's $hour:xx in Amsterdam, not 08:00/20:00 — this cron " \
                   "fire only exists to cover the other DST offset. Skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Process Telegram button presses since last run
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/process_callbacks.py

      - name: Write blog posts for marked items
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_blog_post.py

      - name: Fetch RSS, summarize, notify Telegram
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/fetch_and_notify.py

      - name: Commit and push state changes
        if: steps.gate.outputs.run == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ src/content/blog/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update pipeline state"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        # Pushes made with the default GITHUB_TOKEN don't trigger other
        # workflows (GitHub's anti-recursion guard on `push`), so
        # deploy.yml wouldn't otherwise pick up this commit — kick it
        # off explicitly instead of adding a separate PAT just for this.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
