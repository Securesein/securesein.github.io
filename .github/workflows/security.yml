name: Security channel

# ############################################################
# #  MANUAL TRIGGER ONLY. THERE IS DELIBERATELY NO `schedule`. #
# #                                                            #
# #  This channel classifies each new feed item with a LIVE, PER-ITEM #
# #  model call — there is no bulk path. The first run against a      #
# #  feed file this pipeline has never polled before can find         #
# #  hundreds of "new" items at once, and at one API call per item     #
# #  that first run can take a long time and real OpenAI spend        #
# #  before it settles into its steady, fast, mostly-nothing-new      #
# #  cadence. `limit` (below) exists specifically to bound that.      #
# #                                                                    #
# #  It defaults to a DRY RUN. The `publish` input has to be set to   #
# #  true by hand, per run, for anything to be written.               #
# ############################################################
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Write posts for real (leave false for a dry run)"
        type: boolean
        default: false
      offline_llm:
        description: "Use the deterministic classifiers, no API calls at all"
        type: boolean
        default: false
      limit:
        description: "Cap on items examined this run (protects a first/backlog run from a very long, expensive sweep)"
        type: number
        default: 15

# All five channel-ish workflows share mutable files under state/
# (ledger.json, queue.json, rejected.jsonl) and the radar collection —
# not just append-only logs, but JSON structures two runs can both
# create or reshape at once. The push-retry in the commit step handles
# an append-only collision by rebasing; it CANNOT handle two runs both
# creating state/ledger.json for the first time in the same few
# seconds, which is a real structural conflict, not a fast-forward.
# Queueing here is the actual fix — cancel-in-progress: false means a
# second run waits its turn rather than losing its work or racing.
concurrency:
  group: securesein-pipeline-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  security:
    runs-on: ubuntu-latest
    # Belt-and-suspenders alongside `limit`: a run that is still going
    # after this long is not "processing a big backlog" any more, it is
    # stuck, and an hourly-or-faster schedule must never be allowed to
    # pile up runs on top of one that is hanging.
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run the security channel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/run.py --channel security \
            ${{ inputs.publish && '--publish' || '--dry-run' }} \
            ${{ inputs.offline_llm && '--offline-llm' || '' }} \
            --limit ${{ inputs.limit }}

      # G4. The content schema is the only verification gate that runs
      # AFTER a post is written, and it has to run before the commit: a
      # bad post produces a red workflow and nothing on main.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate against the schema (gate G4)
        run: |
          npm ci
          npm run build

      - name: Reference integrity (gate G5 in CI)
        run: npm run check:content

      - name: Commit state, Radar and any new posts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ src/content/blog/ src/content/benchmarks/ src/content/radar/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Security channel run"
            # Several channels run on overlapping schedules and share files
            # under state/ (rejected.jsonl in particular) — a plain `git
            # push` here was failing outright the instant another workflow's
            # push landed first, discarding this run's real work (including
            # any live model spend) with no retry, and the backlog it never
            # got to mark 'seen' would just get reprocessed, and repaid for,
            # next time. Fetch + rebase + retry: state/*.jsonl is
            # append-only, so a same-file collision is an ordinary
            # fast-forward case for rebase, not a real conflict.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then
                pushed=true
                break
              fi
              echo "Push rejected (attempt $attempt/5) — fetching and rebasing onto the latest main..."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase produced a real conflict — aborting rather than guessing."
                git rebase --abort
                break
              fi
              sleep $(( (RANDOM % 5) + 2 ))
            done
            if [ "$pushed" = "true" ]; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Could not push after retries — this run's state is lost, but nothing corrupt reached main."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      - name: Trigger site deploy
        # A GITHUB_TOKEN push does not cascade into other workflows, so
        # deploy.yml has to be kicked off explicitly.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
