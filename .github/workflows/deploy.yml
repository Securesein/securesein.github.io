name: Build and deploy securesein

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      # Type and template errors, separately from the content schema.
      - name: Type check
        run: npm run check
      # `npm run build` is also the schema gate: the collection schema
      # in src/content.config.ts fails the build on invalid frontmatter,
      # so a bad post never reaches Pages. (The pipeline workflow runs
      # the same check before it commits, which catches it earlier.)
      # postbuild builds the Pagefind index into dist/.
      - name: Build
        run: npm run build
      # Two jobs: it reports the grandfathered archive informationally,
      # and it HARD-FAILS on cross-collection referential integrity —
      # a post citing a benchmark measurement that does not exist, or a
      # section in taxonomy.json with no landing page. Neither is
      # something a per-entry Zod schema can see, and both must block a
      # deploy, so continue-on-error is deliberately absent.
      - name: Content check
        run: npm run check:content
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
