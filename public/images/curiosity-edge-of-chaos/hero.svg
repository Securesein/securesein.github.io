<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="60" y="90" font-family="Georgia, serif" font-size="40" fill="#f1f5f9" font-weight="600">Curiosity at the edge of chaos</text>
  <text x="60" y="128" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">reservoir dynamics · coherence · endogenous exploration</text>

  <!-- Spectrum bar -->
  <rect x="60" y="230" width="1080" height="36" rx="18" fill="url(#spectrum)"/>
  <text x="90" y="300" font-family="Arial, sans-serif" font-size="20" fill="#38bdf8" font-weight="600">Rigid</text>
  <text x="565" y="300" font-family="Arial, sans-serif" font-size="20" fill="#a78bfa" font-weight="600" text-anchor="middle">curiosity window</text>
  <text x="1050" y="300" font-family="Arial, sans-serif" font-size="20" fill="#fb7185" font-weight="600" text-anchor="end">Chaotic</text>

  <!-- Marker on the window -->
  <circle cx="600" cy="248" r="14" fill="#0f172a" stroke="#f1f5f9" stroke-width="3"/>

  <!-- Feedback loop -->
  <g transform="translate(600,470)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 6"/>

    <rect x="-230" y="-20" width="150" height="46" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="-155" y="8" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle">Incoherence</text>

    <rect x="80" y="-20" width="150" height="46" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="155" y="8" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle">Exploration</text>

    <rect x="-75" y="120" width="150" height="46" rx="10" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
    <text x="0" y="148" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0" text-anchor="middle">New coherence</text>

    <path d="M -80 0 L 78 0" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 155 25 L 50 118" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M -50 118 L -150 28" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  </g>

  <text x="60" y="600" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Securesein · notes on AI research</text>
</svg>
