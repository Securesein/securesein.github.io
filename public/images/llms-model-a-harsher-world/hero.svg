<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1420"/>
      <stop offset="55%" stop-color="#131b2b"/>
      <stop offset="100%" stop-color="#1a1424"/>
    </linearGradient>
    <linearGradient id="modelLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0705a"/>
      <stop offset="100%" stop-color="#f2a63b"/>
    </linearGradient>
    <linearGradient id="modelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0705a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f0705a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="humanFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ec8d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5ec8d8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0705a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f0705a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="900" cy="300" rx="420" ry="320" fill="url(#glow)"/>

  <!-- concentric social-distance rings, left -->
  <g transform="translate(196 315)" fill="none" stroke="#5ec8d8">
    <circle r="26" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle r="62" stroke-opacity="0.34" stroke-width="1.2" stroke-dasharray="3 6"/>
    <circle r="104" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="2 8"/>
    <circle r="6" fill="#5ec8d8" fill-opacity="0.9" stroke="none"/>
  </g>
  <g fill="#8fa3c0" font-size="12.5" letter-spacing="1.6">
    <text x="196" y="322" text-anchor="middle" fill="#0e1420" font-size="10" font-weight="700">·</text>
    <text x="196" y="252" text-anchor="middle" fill="#5ec8d8" fill-opacity="0.8">STRONG TIE</text>
    <text x="196" y="216" text-anchor="middle" fill-opacity="0.65">WEAK TIE</text>
    <text x="196" y="182" text-anchor="middle" fill-opacity="0.42">STRANGER</text>
  </g>

  <!-- axis -->
  <g stroke="#6d7f9c" stroke-opacity="0.35" stroke-width="1">
    <line x1="400" y1="470" x2="1090" y2="470"/>
  </g>
  <g fill="#8fa3c0" font-size="13" letter-spacing="1.4" text-anchor="middle" fill-opacity="0.7">
    <text x="470" y="498">STRONG</text>
    <text x="745" y="498">WEAK</text>
    <text x="1020" y="498">STRANGER</text>
  </g>

  <!-- model curve: stays high (punitive) -->
  <path d="M470 218 C 610 224, 640 232, 745 244 C 860 258, 930 268, 1020 282 L1020 470 L470 470 Z" fill="url(#modelFill)"/>
  <path d="M470 218 C 610 224, 640 232, 745 244 C 860 258, 930 268, 1020 282" fill="none" stroke="url(#modelLine)" stroke-width="3.4" stroke-linecap="round"/>
  <g fill="#f0705a">
    <circle cx="470" cy="218" r="6"/>
    <circle cx="745" cy="244" r="6"/>
    <circle cx="1020" cy="282" r="6"/>
  </g>

  <!-- human curve: drops steeply (restraint) -->
  <path d="M470 246 C 600 300, 660 340, 745 372 C 850 410, 940 432, 1020 442 L1020 470 L470 470 Z" fill="url(#humanFill)"/>
  <path d="M470 246 C 600 300, 660 340, 745 372 C 850 410, 940 432, 1020 442" fill="none" stroke="#5ec8d8" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="9 7"/>
  <g fill="#5ec8d8">
    <circle cx="470" cy="246" r="6"/>
    <circle cx="745" cy="372" r="6"/>
    <circle cx="1020" cy="442" r="6"/>
  </g>

  <!-- curve labels -->
  <text x="1040" y="278" fill="#f2a63b" font-size="15" font-weight="600">models</text>
  <text x="1040" y="447" fill="#5ec8d8" font-size="15" font-weight="600">humans</text>

  <!-- title block -->
  <text x="400" y="128" fill="#f4f7fb" font-size="45" font-weight="700">A harsher social world</text>
  <text x="400" y="172" fill="#9db0cc" font-size="19">Predicted willingness to sanction, by social distance</text>
  <line x1="400" y1="196" x2="470" y2="196" stroke="#f0705a" stroke-width="3" stroke-linecap="round"/>

  <text x="400" y="574" fill="#6d7f9c" font-size="14" letter-spacing="0.6">Second-order social reasoning in LLMs · arXiv:2609.05437</text>
</svg>
