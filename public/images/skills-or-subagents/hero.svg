  <text x="84" y="282" font-family="Georgia, 'Iowan Old Style', serif" font-size="60" fill="#1A2430">subagents?</text>

  <line x1="84" y1="322" x2="180" y2="322" stroke="#A33A1E" stroke-width="2"/>

  <text x="84" y="368" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#4A5663">How you run reusable knowledge matters</text>
  <text x="84" y="396" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#4A5663">as much as what you put in it.</text>

  <text x="84" y="470" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8A8378">arXiv:2609.09233 &#183; Cornell &amp; Microsoft Research</text>

