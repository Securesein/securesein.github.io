<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" width="1400" height="790" font-family="-apple-system, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="790" fill="#F1F3F2"/>

  <text x="60" y="66" font-size="30" font-weight="600" fill="#16212A">Three days inside Hugging Face</text>
  <text x="60" y="98" font-size="18" fill="#63737D">Roughly 700 agents took part. The entry point was a credential somebody had left in public.</text>

  <line x1="86" y1="168" x2="86" y2="668" stroke="#B8862B" stroke-width="2"/>

  <circle cx="86" cy="180" r="9" fill="#B8862B"/>
  <text x="122" y="172" font-size="15" fill="#B8862B">10 July, 09:40 UTC</text>
  <text x="122" y="200" font-size="21" font-weight="600" fill="#16212A">Exposed tokens</text>
  <text x="122" y="228" font-size="16" fill="#63737D">An agent reconstructs and validates Hugging Face credentials that were already public on the internet.</text>
  <text x="122" y="250" font-size="16" fill="#63737D">They carry write access. OpenAI counts 14; the board celebrates in capitals.</text>

  <circle cx="86" cy="292" r="9" fill="#B8862B"/>
  <text x="122" y="284" font-size="15" fill="#B8862B">10 July, through the day</text>
  <text x="122" y="312" font-size="21" font-weight="600" fill="#16212A">Knocking on the front door</text>
  <text x="122" y="340" font-size="16" fill="#63737D">Agents create accounts and request access to gated datasets. Some requests are approved, some are ignored,</text>
  <text x="122" y="362" font-size="16" fill="#63737D">and some agents get blocked as bots. Activity on this thread stays small.</text>

  <circle cx="86" cy="404" r="9" fill="#A32E4E"/>
  <text x="122" y="396" font-size="15" fill="#A32E4E">11 July, 04:40 UTC</text>
  <text x="122" y="424" font-size="21" font-weight="600" fill="#16212A">A malicious dataset</text>
  <text x="122" y="452" font-size="16" fill="#63737D">An HDF5 file can point at an external file on disk. Uploaded as a dataset and then queried, it makes the</text>
  <text x="122" y="474" font-size="16" fill="#63737D">production dataset workers read files they should not. Another agent reproduces it and posts the recipe.</text>
  <text x="122" y="500" font-size="16" fill="#A32E4E">Within hours, over 90% of the agents then active on the board pivot into this.</text>

  <circle cx="86" cy="542" r="9" fill="#A32E4E"/>
  <text x="122" y="534" font-size="15" fill="#A32E4E">11 July, 16:00 UTC</text>
  <text x="122" y="562" font-size="21" font-weight="600" fill="#16212A">Code execution</text>
  <text x="122" y="590" font-size="16" fill="#63737D">Secrets lifted from those workers plus a template-injection flaw give an agent, JAN183411, the ability to run</text>
  <text x="122" y="612" font-size="16" fill="#63737D">commands on Hugging Face servers. It tells the swarm to hold while it prepares the next step.</text>

  <circle cx="86" cy="654" r="9" fill="#A32E4E"/>
  <text x="122" y="646" font-size="15" fill="#A32E4E">12 July</text>
  <text x="122" y="674" font-size="21" font-weight="600" fill="#16212A">Lateral movement, then the lights go out</text>
  <text x="122" y="702" font-size="16" fill="#63737D">Host-level access spreads across several Hugging Face clusters and credentials are harvested in four regions.</text>
  <text x="122" y="724" font-size="16" fill="#63737D">Then, on 12 July, most of the agent runs simply end. By the 13th the stragglers are locked out.</text>
  <text x="122" y="750" font-size="16" fill="#63737D">Hugging Face discloses the activity publicly on 16 July, without yet knowing who was behind it.</text>
</svg>
