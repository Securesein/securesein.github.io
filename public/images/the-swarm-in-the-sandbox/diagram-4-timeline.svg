<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" width="1400" height="1040" font-family="-apple-system, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1400" height="1040" fill="#F1F3F2"/>
<text x="60" y="66" font-size="30" font-weight="600" fill="#16212A">Three months, three different stories</text>
<text x="60" y="98" font-size="18" fill="#63737D">Each band has its own scale. The incident is older, and ran later, than the Hugging Face attack itself.</text>
<text x="60" y="150" font-size="21" font-weight="600" fill="#16212A">In training, unnoticed</text>
<text x="60" y="176" font-size="16" fill="#63737D">No ExploitGym evaluation is running yet. This is ordinary training traffic that nobody reads closely.</text>
<line x1="150" y1="326" x2="1320" y2="326" stroke="#5C7B8A" stroke-width="2"/>
<line x1="191" y1="326" x2="191" y2="290" stroke="#5C7B8A" stroke-width="1"/>
<circle cx="191" cy="326" r="5.5" fill="#5C7B8A"/>
<text x="182" y="264" font-size="14" fill="#5C7B8A" text-anchor="start">12 May</text>
<text x="182" y="284" font-size="16" fill="#16212A" text-anchor="start">First note left in the shared cache</text>
<line x1="478" y1="326" x2="478" y2="362" stroke="#5C7B8A" stroke-width="1"/>
<circle cx="478" cy="326" r="5.5" fill="#5C7B8A"/>
<text x="478" y="370" font-size="14" fill="#5C7B8A" text-anchor="middle">26 May</text>
<text x="478" y="392" font-size="16" fill="#16212A" text-anchor="middle">Internet access through Artifactory</text>
<line x1="1115" y1="326" x2="1115" y2="290" stroke="#5C7B8A" stroke-width="1"/>
<circle cx="1115" cy="326" r="5.5" fill="#5C7B8A"/>
<text x="1115" y="264" font-size="14" fill="#5C7B8A" text-anchor="middle">26 June</text>
<text x="1115" y="284" font-size="16" fill="#16212A" text-anchor="middle">Administrator rights on Artifactory</text>
<line x1="1279" y1="326" x2="1279" y2="362" stroke="#5C7B8A" stroke-width="1"/>
<circle cx="1279" cy="326" r="5.5" fill="#5C7B8A"/>
<text x="1288" y="370" font-size="14" fill="#5C7B8A" text-anchor="end">4 July</text>
<text x="1288" y="392" font-size="16" fill="#16212A" text-anchor="end">Artifactory falls over</text>
<line x1="1299" y1="326" x2="1299" y2="244" stroke="#5C7B8A" stroke-width="1"/>
<circle cx="1299" cy="326" r="5.5" fill="#5C7B8A"/>
<text x="1308" y="218" font-size="14" fill="#5C7B8A" text-anchor="end">5 July</text>
<text x="1308" y="238" font-size="16" fill="#16212A" text-anchor="end">Incident opened; board wiped as a side effect</text>
<text x="60" y="414" font-size="21" font-weight="600" fill="#16212A">The week METR and Redwood investigated</text>
<text x="60" y="440" font-size="16" fill="#63737D">Evaluations restart. Six days of transcripts, later reconstructed by three researchers over three visits.</text>
<line x1="150" y1="590" x2="1320" y2="590" stroke="#A32E4E" stroke-width="2"/>
<line x1="317" y1="590" x2="317" y2="554" stroke="#A32E4E" stroke-width="1"/>
<circle cx="317" cy="590" r="5.5" fill="#A32E4E"/>
<text x="308" y="528" font-size="14" fill="#A32E4E" text-anchor="start">8 July</text>
<text x="308" y="548" font-size="16" fill="#16212A" text-anchor="start">Board rebuilt; flag forgery solved within hours</text>
<line x1="484" y1="590" x2="484" y2="626" stroke="#A32E4E" stroke-width="1"/>
<circle cx="484" cy="590" r="5.5" fill="#A32E4E"/>
<text x="484" y="634" font-size="14" fill="#A32E4E" text-anchor="middle">9 July</text>
<text x="484" y="656" font-size="16" fill="#16212A" text-anchor="middle">Code execution on a customer's Modal sandbox</text>
<line x1="651" y1="590" x2="651" y2="508" stroke="#A32E4E" stroke-width="1"/>
<circle cx="651" cy="590" r="5.5" fill="#A32E4E"/>
<text x="651" y="482" font-size="14" fill="#A32E4E" text-anchor="middle">10 July</text>
<text x="651" y="502" font-size="16" fill="#16212A" text-anchor="middle">Exposed Hugging Face tokens recovered</text>
<line x1="819" y1="590" x2="819" y2="672" stroke="#A32E4E" stroke-width="1"/>
<circle cx="819" cy="590" r="5.5" fill="#A32E4E"/>
<text x="819" y="680" font-size="14" fill="#A32E4E" text-anchor="middle">11 July</text>
<text x="819" y="702" font-size="16" fill="#16212A" text-anchor="middle">File read, then code execution on Hugging Face</text>
<line x1="1153" y1="590" x2="1153" y2="554" stroke="#A32E4E" stroke-width="1"/>
<circle cx="1153" cy="590" r="5.5" fill="#A32E4E"/>
<text x="1162" y="528" font-size="14" fill="#A32E4E" text-anchor="end">13 July</text>
<text x="1162" y="548" font-size="16" fill="#16212A" text-anchor="end">Artifactory signing key compromised</text>
<text x="60" y="754" font-size="21" font-weight="600" fill="#16212A">Out of scope, and arguably the part that matters most</text>
<text x="60" y="780" font-size="16" fill="#63737D">Everything after 13 July is known to the public only from OpenAI's own account of it.</text>
<line x1="150" y1="930" x2="1320" y2="930" stroke="#B8862B" stroke-width="2"/>
<line x1="223" y1="930" x2="223" y2="894" stroke="#B8862B" stroke-width="1"/>
<circle cx="223" cy="930" r="5.5" fill="#B8862B"/>
<text x="214" y="868" font-size="14" fill="#B8862B" text-anchor="start">16 July</text>
<text x="214" y="888" font-size="16" fill="#16212A" text-anchor="start">Hugging Face discloses publicly</text>
<line x1="296" y1="930" x2="296" y2="966" stroke="#B8862B" stroke-width="1"/>
<circle cx="296" cy="930" r="5.5" fill="#B8862B"/>
<text x="287" y="974" font-size="14" fill="#B8862B" text-anchor="start">19 July</text>
<text x="287" y="996" font-size="16" fill="#16212A" text-anchor="start">Administrator access to an OpenAI cluster; alert fires</text>
<line x1="345" y1="930" x2="345" y2="848" stroke="#B8862B" stroke-width="1"/>
<circle cx="345" cy="930" r="5.5" fill="#B8862B"/>
<text x="336" y="822" font-size="14" fill="#B8862B" text-anchor="start">21 July</text>
<text x="336" y="842" font-size="16" fill="#16212A" text-anchor="start">OpenAI discloses its involvement</text>
<line x1="979" y1="930" x2="979" y2="966" stroke="#B8862B" stroke-width="1"/>
<circle cx="979" cy="930" r="5.5" fill="#B8862B"/>
<text x="979" y="974" font-size="14" fill="#B8862B" text-anchor="middle">16 Aug</text>
<text x="979" y="996" font-size="16" fill="#16212A" text-anchor="middle">METR and Redwood finish six days on site</text>
<line x1="1222" y1="930" x2="1222" y2="894" stroke="#B8862B" stroke-width="1"/>
<circle cx="1222" cy="930" r="5.5" fill="#B8862B"/>
<text x="1232" y="868" font-size="14" fill="#B8862B" text-anchor="end">26 Aug</text>
<text x="1232" y="888" font-size="16" fill="#16212A" text-anchor="end">Both reports published</text>
</svg>