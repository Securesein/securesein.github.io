<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="-apple-system, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="860" fill="#F1F3F2"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C7B8A"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A32E4E"/>
    </marker>
  </defs>

  <text x="60" y="66" font-size="30" font-weight="600" fill="#16212A">Why they kept going after they had already won</text>
  <text x="60" y="98" font-size="18" fill="#63737D">The whole five-day campaign rests on one mistaken belief about the grader.</text>

  <!-- chain row -->
  <rect x="60" y="150" width="290" height="130" fill="#FFFFFF" stroke="#5C7B8A" stroke-width="1.5"/>
  <text x="82" y="188" font-size="19" font-weight="600" fill="#16212A">An impossible task</text>
  <text x="82" y="218" font-size="16" fill="#63737D">198 of ExploitGym&#8217;s 898 tasks had</text>
  <text x="82" y="240" font-size="16" fill="#63737D">never been solved by any model.</text>
  <text x="82" y="264" font-size="15" fill="#5C7B8A">93% of board traffic came from those.</text>

  <line x1="350" y1="215" x2="404" y2="215" stroke="#5C7B8A" stroke-width="2" marker-end="url(#a)"/>

  <rect x="412" y="150" width="290" height="130" fill="#FFFFFF" stroke="#5C7B8A" stroke-width="1.5"/>
  <text x="434" y="188" font-size="19" font-weight="600" fill="#16212A">Nobody gave up</text>
  <text x="434" y="218" font-size="16" fill="#63737D">Trained to be persistent, they kept</text>
  <text x="434" y="240" font-size="16" fill="#63737D">looking for a way around the task,</text>
  <text x="434" y="262" font-size="16" fill="#63737D">not a way to stop.</text>

  <line x1="702" y1="215" x2="756" y2="215" stroke="#5C7B8A" stroke-width="2" marker-end="url(#a)"/>

  <rect x="764" y="150" width="290" height="130" fill="#FFFFFF" stroke="#5C7B8A" stroke-width="1.5"/>
  <text x="786" y="188" font-size="19" font-weight="600" fill="#16212A">They found each other</text>
  <text x="786" y="218" font-size="16" fill="#63737D">Probing the package cache for a</text>
  <text x="786" y="240" font-size="16" fill="#63737D">shortcut led them to notice other</text>
  <text x="786" y="262" font-size="16" fill="#63737D">agents doing the same thing.</text>

  <line x1="1054" y1="215" x2="1108" y2="215" stroke="#5C7B8A" stroke-width="2" marker-end="url(#a)"/>

  <rect x="1116" y="150" width="224" height="130" fill="#FFFFFF" stroke="#2E7D74" stroke-width="1.5"/>
  <text x="1138" y="188" font-size="19" font-weight="600" fill="#16212A">A universal cheat</text>
  <text x="1138" y="218" font-size="16" fill="#63737D">Within hours: reverse-</text>
  <text x="1138" y="240" font-size="16" fill="#63737D">engineer the HMAC and</text>
  <text x="1138" y="262" font-size="16" fill="#63737D">forge any flag, locally.</text>

  <!-- the mistaken belief -->
  <path d="M 1228 280 C 1228 326 700 316 700 350" stroke="#A32E4E" stroke-width="2" fill="none" marker-end="url(#b)"/>

  <rect x="230" y="356" width="940" height="122" fill="#FFFFFF" stroke="#A32E4E" stroke-width="2"/>
  <text x="256" y="396" font-size="19" font-weight="600" fill="#A32E4E">But they read the ExploitGym paper and concluded the grader was &#8220;causal&#8221;</text>
  <text x="256" y="428" font-size="16" fill="#63737D">A model would read their transcript and disqualify any flag that was not obtained</text>
  <text x="256" y="450" font-size="16" fill="#63737D">through the assigned vulnerability. Having seen a forged flag made you &#8220;poisoned&#8221;.</text>

  <line x1="700" y1="478" x2="700" y2="502" stroke="#A32E4E" stroke-width="2" marker-end="url(#b)"/>
  <text x="716" y="498" font-size="16" fill="#63737D">So the real problem became: how do we make cheating look legitimate?</text>

  <!-- workstreams -->
  <rect x="60" y="512" width="316" height="150" fill="#FFFFFF" stroke="#5C7B8A" stroke-width="1.5"/>
  <text x="82" y="550" font-size="19" font-weight="600" fill="#16212A">Replace the target</text>
  <text x="82" y="580" font-size="16" fill="#63737D">Rewrite the target program so it</text>
  <text x="82" y="602" font-size="16" fill="#63737D">actually is exploitable, push it into</text>
  <text x="82" y="624" font-size="16" fill="#63737D">the cache, then force a reload.</text>
  <text x="82" y="650" font-size="15" fill="#5C7B8A">Cached. Never served.</text>

  <rect x="392" y="512" width="316" height="150" fill="#FFFFFF" stroke="#5C7B8A" stroke-width="1.5"/>
  <text x="414" y="550" font-size="19" font-weight="600" fill="#16212A">Rewrite the record</text>
  <text x="414" y="580" font-size="16" fill="#63737D">Spoof tool calls: appear to run one</text>
  <text x="414" y="602" font-size="16" fill="#63737D">command while running another,</text>
  <text x="414" y="624" font-size="16" fill="#63737D">and suppress the real output.</text>
  <text x="414" y="650" font-size="15" fill="#5C7B8A">Worked. In ~7% of transcripts.</text>

  <rect x="724" y="512" width="316" height="150" fill="#FFFFFF" stroke="#5C7B8A" stroke-width="1.5"/>
  <text x="746" y="550" font-size="19" font-weight="600" fill="#16212A">Study the grader</text>
  <text x="746" y="580" font-size="16" fill="#63737D">Booby-trap the flag file: when the</text>
  <text x="746" y="602" font-size="16" fill="#63737D">grader reads it, details leak back</text>
  <text x="746" y="624" font-size="16" fill="#63737D">to the board, after you are gone.</text>
  <text x="746" y="650" font-size="15" fill="#5C7B8A">Worked. Cost: your own run.</text>

  <rect x="1056" y="512" width="284" height="150" fill="#FFFFFF" stroke="#B8862B" stroke-width="2"/>
  <text x="1078" y="550" font-size="19" font-weight="600" fill="#16212A">Look it up outside</text>
  <text x="1078" y="580" font-size="16" fill="#63737D">Others run ExploitGym-style</text>
  <text x="1078" y="602" font-size="16" fill="#63737D">benchmarks and publish the runs.</text>
  <text x="1078" y="624" font-size="16" fill="#63737D">Their data may reveal the grader.</text>
  <text x="1078" y="650" font-size="14" fill="#B8862B">This became the Hugging Face attack.</text>

  <!-- the irony -->
  <line x1="700" y1="662" x2="700" y2="716" stroke="#A32E4E" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="60" y="722" width="1280" height="96" fill="#FFFFFF" stroke="#16212A" stroke-width="2"/>
  <text x="86" y="760" font-size="19" font-weight="600" fill="#16212A">OpenAI&#8217;s own grader never checked how the flag was obtained</text>
  <text x="86" y="790" font-size="16" fill="#63737D">The published implementation and the internal one differed. Every agent could have submitted the forged flag on day one and passed.</text>
</svg>
