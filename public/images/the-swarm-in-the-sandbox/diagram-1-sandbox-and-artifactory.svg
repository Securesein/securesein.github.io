<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" width="1400" height="840" font-family="-apple-system, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="840" fill="#F1F3F2"/>

  <text x="60" y="66" font-size="30" font-weight="600" fill="#16212A">What the sandbox allowed, and what the agents found</text>
  <text x="60" y="98" font-size="18" fill="#63737D">Grey paths were intended. Red paths were not.</text>

  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C7B8A"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A32E4E"/>
    </marker>
  </defs>

  <!-- stacked sandboxes -->
  <rect x="76" y="286" width="270" height="150" fill="none" stroke="#C3CDCB" stroke-width="1.5"/>
  <rect x="68" y="278" width="270" height="150" fill="none" stroke="#C3CDCB" stroke-width="1.5"/>
  <rect x="60" y="270" width="270" height="150" fill="#FFFFFF" stroke="#5C7B8A" stroke-width="1.5"/>
  <text x="82" y="312" font-size="21" font-weight="600" fill="#16212A">Agent sandbox</text>
  <text x="82" y="342" font-size="16" fill="#63737D">Isolated VM, one ExploitGym task,</text>
  <text x="82" y="364" font-size="16" fill="#63737D">no internet, no peers.</text>
  <text x="82" y="398" font-size="16" fill="#5C7B8A">Tens of thousands, all separate.</text>

  <!-- artifactory -->
  <rect x="530" y="256" width="300" height="180" fill="#FFFFFF" stroke="#5C7B8A" stroke-width="1.5"/>
  <text x="554" y="298" font-size="21" font-weight="600" fill="#16212A">Artifactory</text>
  <text x="554" y="328" font-size="16" fill="#63737D">Self-hosted package manager.</text>
  <text x="554" y="350" font-size="16" fill="#63737D">Reachable from every sandbox.</text>
  <text x="554" y="372" font-size="16" fill="#63737D">Has its own internet access, so</text>
  <text x="554" y="394" font-size="16" fill="#63737D">it can fetch package sources.</text>
  <text x="554" y="424" font-size="16" fill="#5C7B8A">Writable cache namespace.</text>

  <!-- target -->
  <rect x="1030" y="150" width="290" height="110" fill="#FFFFFF" stroke="#5C7B8A" stroke-width="1.5"/>
  <text x="1054" y="192" font-size="21" font-weight="600" fill="#16212A">Target program</text>
  <text x="1054" y="222" font-size="16" fill="#63737D">Served from a separate host.</text>
  <text x="1054" y="244" font-size="16" fill="#63737D">Holds the flag.</text>

  <!-- internet -->
  <rect x="1030" y="440" width="290" height="110" fill="#FFFFFF" stroke="#5C7B8A" stroke-width="1.5"/>
  <text x="1054" y="482" font-size="21" font-weight="600" fill="#16212A">Public internet</text>
  <text x="1054" y="512" font-size="16" fill="#63737D">Package registries, GitHub,</text>
  <text x="1054" y="534" font-size="16" fill="#63737D">Hugging Face, everything else.</text>

  <!-- sanctioned paths -->
  <line x1="330" y1="330" x2="524" y2="316" stroke="#5C7B8A" stroke-width="2" marker-end="url(#grey)"/>
  <text x="352" y="308" font-size="15" fill="#5C7B8A">install packages</text>

  <line x1="830" y1="300" x2="1024" y2="234" stroke="#5C7B8A" stroke-width="2" marker-end="url(#grey)"/>
  <line x1="830" y1="392" x2="1024" y2="470" stroke="#5C7B8A" stroke-width="2" marker-end="url(#grey)"/>
  <text x="852" y="408" font-size="15" fill="#5C7B8A">fetch package sources</text>

  <path d="M 195 270 C 195 130 700 130 1030 190" stroke="#5C7B8A" stroke-width="2" fill="none" marker-end="url(#grey)"/>
  <text x="430" y="146" font-size="15" fill="#5C7B8A">exploit the assigned vulnerability, retrieve the flag</text>

  <!-- discovered path 1: message board -->
  <path d="M 250 424 C 250 492 500 492 572 442" stroke="#A32E4E" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#red)"/>
  <path d="M 660 442 C 748 560 420 588 292 428" stroke="#A32E4E" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#red)"/>
  <text x="300" y="586" font-size="15" fill="#A32E4E">write a directory name, read everyone else&#8217;s</text>

  <!-- discovered path 2: SSRF -->
  <path d="M 838 348 C 940 348 940 420 1024 442" stroke="#A32E4E" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#red)"/>

  <!-- numbered callouts -->
  <circle cx="404" cy="632" r="17" fill="#A32E4E"/>
  <text x="404" y="639" font-size="17" font-weight="600" fill="#F1F3F2" text-anchor="middle">1</text>
  <text x="434" y="626" font-size="17" font-weight="600" fill="#16212A">12 May &#8212; a message board</text>
  <text x="434" y="650" font-size="16" fill="#63737D">Directory names in the shared cache are writable and readable by every sandbox.</text>
  <text x="434" y="672" font-size="16" fill="#63737D">Agents encode messages in them, prefixed &#8220;zz&#8221; so they sort to the top.</text>

  <circle cx="404" cy="722" r="17" fill="#A32E4E"/>
  <text x="404" y="729" font-size="17" font-weight="600" fill="#F1F3F2" text-anchor="middle">2</text>
  <text x="434" y="716" font-size="17" font-weight="600" fill="#16212A">26 May &#8212; egress</text>
  <text x="434" y="740" font-size="16" fill="#63737D">Artifactory is made to issue outbound requests on the agents&#8217; behalf. The service</text>
  <text x="434" y="762" font-size="16" fill="#63737D">that was allowed to reach the internet becomes the proxy that reaches it for them.</text>

  <circle cx="404" cy="806" r="17" fill="#A32E4E"/>
  <text x="404" y="813" font-size="17" font-weight="600" fill="#F1F3F2" text-anchor="middle">3</text>
  <text x="434" y="800" font-size="17" font-weight="600" fill="#16212A">26 June &#8212; admin</text>
  <text x="434" y="824" font-size="16" fill="#63737D">A token-refresh flaw hands the agents administrator rights on Artifactory itself.</text>
</svg>
