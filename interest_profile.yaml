# ---------------------------------------------------------------------------
# Editorial identity
# ---------------------------------------------------------------------------
# The single sentence the relevance gate is ultimately answering.

# REVISED UNDER A2. The previous premise described a practitioner blog with
# an AI pillar; the site is now an AI research radar written by a
# practitioner. The difference is which half is the subject.
premise: >
  Securesein is an AI research radar written by a hands-on engineer. It
  explains how AI systems actually work — mechanism first — to readers who
  are technically strong but not AI researchers, and it takes the security
  and reliability of those systems seriously because its author has to
  deploy and defend things for a living. Mechanism over event, everywhere:
  a piece explaining how something works outranks one reporting that it
  happened.

audience: practitioners — technically literate, not AI researchers
language: English
voice: explanatory, mechanism-first, no hype, willing to say "this is a vendor claim"

# ---------------------------------------------------------------------------
# Strong interests
# ---------------------------------------------------------------------------
# These should dominate the ranking. Each carries the evidence it rests on so
# a wrong entry can be traced and removed rather than argued about.

strong_interests:

  - topic: mechanistic interpretability
    evidence: >
      Directed a full post on abliteration, read Arditi et al. (arXiv:2406.11717)
      plus the circuit-breakers and TAR follow-ups, and worked through the
      residual stream, embeddings-vs-token-ids, attention, dot products and the
      two-cloud geometry of the refusal direction in detail.
    signals: [residual stream, activation steering, probing, features, circuits,
              refusal direction, representation engineering, sparse autoencoders]

  - topic: how LLMs work internally
    evidence: >
      Directed a long-form post on tokens covering BPE, vocabulary construction,
      embeddings, the autoregressive loop, context windows and caching, and
      rewrote it twice for narrative coherence.
    signals: [tokenization, BPE, embeddings, attention, context window, KV cache,
              sampling, autoregressive]

  - topic: LLM and agent security
    evidence: >
      Abliteration (guardrail removal), Carlini on memorization and data leakage,
      and an explicit request for a Security section covering LLM, RL and general
      AI security. Professionally responsible for locked-down device estates.
    signals: [prompt injection, jailbreak, guardrail bypass, agent hijacking,
              tool abuse, data exfiltration, memorization, adversarial, supply chain,
              MCP security, sandbox escape]

  - topic: reasoning and inference efficiency
    evidence: >
      Runs models on an 8GB integrated-graphics laptop; explicitly interested in
      what makes inference cheaper and reasoning better.
    signals: [speculative decoding, quantization, distillation, KV cache,
              chain of thought, test-time compute, reasoning effort, MoE, latency]

  - topic: ML foundations
    evidence: >
      Working through *Why Machines Learn* and Andrew Ng's deep learning course;
      studied PCA, ADALINE/LMS, perceptrons and backpropagation. Prefers concrete
      numerical examples before abstraction.
    signals: [gradient descent, backpropagation, loss landscape, optimization,
              representation learning, scaling laws, training dynamics]

  - topic: open-weight models and local inference
    evidence: >
      Runs Ollama locally, tracks what is runnable on modest hardware, chose a
      cloud/local split deliberately.
    signals: [open weights, GGUF, llama.cpp, Ollama, vLLM, on-device, edge,
              consumer hardware, VRAM]

  - topic: deploying and serving models in production
    evidence: >
      Building professional Azure AI capability for client engagements —
      Azure OpenAI, AI Search, AI Foundry, Semantic Kernel. This is his paid work.
    # NARROWED UNDER A2 (was "enterprise AI in practice"). What survives is the
    # half that describes how a model is actually served and retrieved against,
