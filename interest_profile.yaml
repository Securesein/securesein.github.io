# ---------------------------------------------------------------------------
# Low interests — publishable only with an unusually high quality score
# ---------------------------------------------------------------------------

low_interests:
  - AI productivity tooling and app roundups
  - AI in creative industries
  - hardware and datacenter buildouts, unless it changes what is runnable locally
  - robotics
  - autonomous vehicles
  - AI and employment commentary

# ---------------------------------------------------------------------------
# Exclusions — hard drop, no score, no queue
# ---------------------------------------------------------------------------

exclude:
  - funding rounds, valuations, IPOs, acquisitions
  - executive hires, departures and org restructures
  - corporate press releases with no technical substance
  - partnership and customer-win announcements
  # Requoted: the original line was `- "AI will transform <industry>" opinion
  # pieces`, which is not valid YAML — a scalar may not start with a quoted
  # run and then continue unquoted. As written the whole file failed to
  # parse, so the exclude list would never have loaded. Content unchanged.
  - '"AI will transform <industry>" opinion pieces' 
  - publisher-about-itself stories
  - conference and webinar announcements
  - product marketing and sponsored content
  - listicles and "top N tools" content
  - restatements of a release already covered (handled by entity dedup, but
    excluded here too as a second line of defence)

# ---------------------------------------------------------------------------
# Scoring
# ---------------------------------------------------------------------------
# Two stages, deliberately not one weighted sum.
#
# A single 0-100 score lets a technically excellent but irrelevant paper
# outrank a merely good but highly relevant one. Gate first, then rank.

quality_gate:
  # Pass/fail. Below this, the item never reaches ranking regardless of topic.
  minimum: 55
  components:
    technical_substance: 40   # does it contain a mechanism, a result, a number?
    source_quality: 25        # primary > lab blog > quality press > aggregator
    novelty: 20               # new, not a restatement
    verifiability: 15         # claims traceable to something checkable

relevance_rank:
  # Only applied to items that passed the gate. This is what orders the queue.
  components:
    strong_interest_match: 45
    medium_interest_match: 20
    section_fit: 15           # does it clearly belong in one of the sections?
    depth_bonus: 10           # explains a mechanism rather than reporting an event
    topic_starvation: 10      # see below
  low_interest_penalty: -25

# Topic starvation keeps the site filling out evenly without lowering the bar.
# It is a tie-breaker among items that already passed the quality gate — it can
# reorder the queue, it can never push a failing item into it.
topic_starvation:
  enabled: true
  days_before_bonus: 10
  max_bonus: 10
  applies_to: [topics]        # not to sections, not to vendors

# Anti-filter-bubble. Percentages of the weekly published mix.
discovery:
  strong_interest_share: 0.70
  adjacent_share: 0.20
  serendipity_share: 0.10
  note: >
    The serendipity slot draws from items that passed the quality gate with a
    high quality score but low relevance. It exists to find interests the
    profile does not know about yet. Never fill it with low-quality items —
    serendipity is about topic, not standards.

# ---------------------------------------------------------------------------
# Feedback → profile updates
# ---------------------------------------------------------------------------

feedback:
  kinds:
    interesting:    { weight: 1,  scope: item }
    not_useful:     { weight: -1, scope: item }
    not_my_topic:   { weight: -3, scope: topic }
    deep_dive:      { weight: 3,  scope: topic }
    retract:        { weight: -3, scope: item, action: unpublish }

  # Accumulated evidence only. One reaction never moves the profile.
  promotion_threshold: 8      # net positive signals before a topic moves up a tier
  demotion_threshold: -8
  min_observations: 10        # never act on a topic with fewer than this many rated items
  requires_confirmation: true # Scout proposes a profile change; Sebastiaan approves

  # Guard against the profile collapsing onto one subject.
  floor:
    min_topics_at_strong: 5
    never_auto_exclude: true  # only Sebastiaan may add to the exclude list

