# Securesein — interest profile
#
# Drives Scout's personal-relevance ranking. Read together with
# securesein-channels-brief.md (§6 releases, §7 benchmarks).
#
# PROVENANCE: this profile is derived from observed behaviour, not from a
# questionnaire. Every entry under `evidence:` points at something Sebastiaan
# actually spent time on — posts he directed himself, papers he read through,
# concepts he asked follow-up questions about, and his professional work.
# That makes it a starting hypothesis, not ground truth. It is expected to be
# wrong in places and is corrected through Telegram feedback, never by hand-
# editing the classifier.
#
# NOT DERIVED FROM: what he clicked, how long he read, or any engagement
# metric. There is no such data and there should not be.

